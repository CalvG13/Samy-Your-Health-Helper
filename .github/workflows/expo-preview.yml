# Hosts the Expo dev server on a GitHub runner and exposes it through Expo's
# tunnel, so the app can be opened in Expo Go on any phone without a local setup.
#
# One-time setup:
#   1. Create a free Expo account and sign in to the Expo Go app with it.
#   2. expo.dev → Account settings → Access tokens → create a personal token.
#   3. GitHub → Settings → Secrets and variables → Actions → add it as EXPO_TOKEN.
#
# Then: Actions → "Expo Go preview" → Run workflow with a random code. The URL is
# exp://<code>-<expo username>-8081.exp.direct (also printed, with a QR code, in the
# "Preview is online" step). Expo Go must be signed in to the same account, because
# projects opened over the internet must be signed by it.
name: Expo Go preview

run-name: Expo Go preview

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Tunnel code, 6-24 lowercase letters/digits. URL: exp://<code>-<expo username>-8081.exp.direct"
        required: true
      expo_username:
        description: "Your Expo username (optional; if set, must match the EXPO_TOKEN account)"
        required: false
        default: ""
      minutes:
        description: "How long to keep the preview online (max 120)"
        required: true
        default: "60"

permissions:
  contents: read

concurrency:
  group: expo-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TUNNEL_CODE: ${{ inputs.code }}
      EXPECTED_USERNAME: ${{ inputs.expo_username }}
      PREVIEW_MINUTES: ${{ inputs.minutes }}
      # Optional repository variables; the app falls back to mock data when they're unset.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Validate inputs
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Add a personal Expo access token as the EXPO_TOKEN repository secret (see the top of this workflow)."; exit 1
          fi
          if [[ ! "$TUNNEL_CODE" =~ ^[a-z0-9]{6,24}$ ]]; then
            echo "::error::code must be 6-24 lowercase letters or digits"; exit 1
          fi
          if [[ ! "$PREVIEW_MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] || (( 10#$PREVIEW_MINUTES > 120 )); then
            echo "::error::minutes must be a whole number from 1 to 120"; exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          # Expo's tunnel client; resolved from the project so the CLI never prompts to install it.
          npm install --no-save --no-audit --no-fund @expo/ngrok@^4.1.0

      - name: Link Expo account and project
        run: |
          EXPO_USER=$(npx expo whoami 2>/dev/null | tail -n 1 | tr -d '[:space:]') || EXPO_USER=""
          if [[ -z "$EXPO_USER" || "$EXPO_USER" == "Notloggedin" ]]; then
            echo "::error::EXPO_TOKEN was rejected by Expo. Create a new personal access token and update the secret."; exit 1
          fi
          if [[ "$EXPO_USER" == *"(robot)"* || "$EXPO_USER" == "robot" ]]; then
            echo "::error::EXPO_TOKEN is a robot token. Expo tunnels need a personal access token."; exit 1
          fi
          if [[ -n "$EXPECTED_USERNAME" && "${EXPO_USER,,}" != "${EXPECTED_USERNAME,,}" ]]; then
            echo "::error::EXPO_TOKEN belongs to @$EXPO_USER, not @$EXPECTED_USERNAME."; exit 1
          fi
          echo "Signed in to Expo as @$EXPO_USER"

          # Creates @<user>/samy-your-health-helper on first run, links it afterwards. Expo Go only
          # opens remote projects whose manifest is signed with this project's development certificate.
          npx --yes eas-cli@24.12.1 init --account "$EXPO_USER" --non-interactive --force

          project_id=$(node -p 'require("./app.json").expo.extra?.eas?.projectId ?? ""')
          if [[ ! "$project_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::eas init did not link an Expo project (got '$project_id')."; exit 1
          fi
          # Same slug the CLI uses for the tunnel hostname (<urlRandomness>-<username>-<port>.exp.direct).
          user_slug=$(node -e '
            const cli = require.resolve("@expo/cli/package.json", { paths: [require.resolve("expo/package.json")] });
            const slugify = require(require.resolve("slugify", { paths: [cli] }));
            console.log(slugify(process.argv[1], { remove: /\./ }));
          ' "$EXPO_USER")
          {
            echo "EXPO_PROJECT_ID=$project_id"
            echo "TUNNEL_HOST=${TUNNEL_CODE}-${user_slug}-8081.exp.direct"
          } >> "$GITHUB_ENV"

      - name: Start dev server and tunnel
        run: |
          mkdir -p .expo
          printf '{"urlRandomness":"%s"}\n' "$TUNNEL_CODE" > .expo/settings.json

          start_expo() {
            nohup npx expo start --tunnel --port 8081 >> "$RUNNER_TEMP/expo.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/expo.pid"
          }

          # Succeed only once this project's dev server answers through the public tunnel.
          launches=1
          start_expo
          for attempt in $(seq 1 120); do
            served_id=$(curl -fsS --max-time 10 -H "expo-platform: ios" -H "accept: application/expo+json" \
              "https://$TUNNEL_HOST/" 2>/dev/null | jq -r '.extra.eas.projectId // empty' 2>/dev/null) || served_id=""
            if [[ -n "$served_id" && "$served_id" == "$EXPO_PROJECT_ID" ]]; then
              # The CLI silently moves to a random hostname on a name conflict and rewrites this file.
              if [[ "$(jq -r '.urlRandomness // empty' .expo/settings.json)" != "$TUNNEL_CODE" ]]; then
                echo "::error::Tunnel hostname changed after a conflict; re-run with a different code."
                cat "$RUNNER_TEMP/expo.log"; exit 1
              fi
              echo "Tunnel is live: exp://$TUNNEL_HOST"
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/expo.pid")" 2>/dev/null; then
              if (( launches < 2 )); then
                echo "::warning::Expo dev server exited; retrying once"; launches=$((launches + 1)); start_expo
              else
                echo "::error::Expo dev server exited"; cat "$RUNNER_TEMP/expo.log"; exit 1
              fi
            fi
            if [[ $attempt -eq 120 ]]; then
              echo "::error::Tunnel did not come up at https://$TUNNEL_HOST"; cat "$RUNNER_TEMP/expo.log"; exit 1
            fi
            sleep 2
          done

          # Ask for a signed manifest the way Expo Go does. Without a signature Expo Go refuses to
          # open the project ("You need to be signed in to Expo Go and Expo CLI").
          if ! curl -fsS --max-time 30 -o /dev/null -D - \
              -H "expo-platform: ios" -H "accept: application/expo+json" \
              -H 'expo-expect-signature: sig, keyid="expo-root", alg="rsa-v1_5-sha256"' \
              "https://$TUNNEL_HOST/" | grep -qi '^expo-signature:'; then
            echo "::error::The dev server is not signing manifests, so Expo Go would refuse to open it."
            cat "$RUNNER_TEMP/expo.log"; exit 1
          fi
          echo "Manifest is signed for Expo Go"

      - name: Pre-build bundles
        continue-on-error: true
        run: |
          # Best effort: build the iOS and Android bundles now so the first open in Expo Go is fast.
          for platform in ios android; do
            bundle_url=$(curl -fsS --max-time 60 -H "expo-platform: $platform" -H "accept: application/expo+json" \
              http://localhost:8081/ 2>/dev/null | jq -r '.launchAsset.url // empty' 2>/dev/null) || bundle_url=""
            if [[ -n "$bundle_url" ]]; then
              local_url=$(sed -E 's#^https?://[^/]+#http://localhost:8081#' <<< "$bundle_url")
              curl -fsS --max-time 600 -o /dev/null "$local_url" && echo "Pre-built $platform bundle" \
                || echo "::warning::Could not pre-build the $platform bundle"
            fi
          done


      - name: Preview is online (scan the QR code in Expo Go)
        run: |
          echo "Expo Go URL: exp://$TUNNEL_HOST"
          # qrcode-terminal ignores its argument when stdin isn't a TTY, so pipe the URL in.
          printf '%s\n' "exp://$TUNNEL_HOST" | npx --yes qrcode-terminal@0.12.0 || true
          {
            echo "### Expo Go preview"
            echo
            echo "\`exp://$TUNNEL_HOST\` (only works while this run is in progress)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Online for $PREVIEW_MINUTES minutes. Cancel the run to stop early."
          tail -n +1 -f "$RUNNER_TEMP/expo.log" &
          end=$(( $(date +%s) + 10#$PREVIEW_MINUTES * 60 ))
          fails=0
          # Fail the job (visible in the run status) if the server or tunnel dies mid-preview.
          while (( $(date +%s) < end )); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/expo.pid")" 2>/dev/null; then
              echo "::error::Expo dev server exited"; exit 1
            fi
            if curl -fsS --max-time 10 "https://$TUNNEL_HOST/status" 2>/dev/null | grep -q "packager-status:running"; then
              fails=0
            else
              fails=$((fails + 1))
              if (( fails >= 4 )); then
                echo "::error::Tunnel stopped responding"; exit 1
              fi
            fi
            sleep 30
          done
          echo "Preview time is up."
